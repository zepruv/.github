name: AWS login
description: >
  Authenticate to AWS with GitHub OIDC (preferred: no stored keys) or, if no role is given, with access keys.
  The calling job needs `permissions: id-token: write` for the OIDC path.
inputs:
  role_arn:
    description: IAM role to assume through GitHub OIDC
    required: false
    default: ""
  access_key_id:
    required: false
    default: ""
  secret_access_key:
    required: false
    default: ""
  region:
    required: false
    default: ap-south-2
runs:
  using: composite
  steps:
    - name: Assume role (OIDC)
      if: ${{ inputs.role_arn != '' }}
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role_arn }}
        aws-region: ${{ inputs.region }}
    - name: Use access keys
      if: ${{ inputs.role_arn == '' }}
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ inputs.access_key_id }}
        aws-secret-access-key: ${{ inputs.secret_access_key }}
        aws-region: ${{ inputs.region }}
