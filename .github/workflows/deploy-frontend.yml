name: "Reusable: build and deploy a frontend to Cloudflare Workers (static assets)"

# Builds a Vite app and deploys it with `wrangler deploy --env <environment>`, behind the caller's CI gates.
#
# The repo has ONE wrangler.jsonc; every environment is a block under "env" and becomes its own Worker
# (`<name>-<environment>`), created on first deploy with no dashboard step. Each block owns everything that differs:
#   - "routes": [{ "pattern": "staging.example.com", "custom_domain": true }]   Cloudflare creates the DNS record + certificate
#   - "vars":   { "API_BACKEND_URL": "https://staging-api.example.com" }        runtime settings of the /api proxy
# Build-time VITE_* values are passed per environment in `build_env` (the caller fills them from GitHub repository
# Variables such as STAGING_API_URL, so no env file is ever committed) and the caller passes `--mode <mode>` in
# build_command - so a build only ever contains its own environment's values.
#
# Everything in a VITE_* value is PUBLIC once it is in the bundle. Mistakes are guarded, not trusted away: build_env only
# accepts VITE_* names and refuses names containing SECRET / PASSWORD / PASSWD / PRIVATE / CREDENTIAL, and the finished
# bundle is scanned with gitleaks before anything is uploaded (a `.gitleaks.toml` in the project root is honoured, e.g. to
# allow a public-by-design tracking key).
#
# There is no branch alias or CNAME to drift: a hostname is bound to one specific Worker by the deploy itself. Every deploy
# still ships /version.txt and, when `health_url` is set, the run fails unless that URL serves THIS commit, which also
# catches a domain that was never attached or a stale deployment.
#
# Never run `wrangler deploy` without --env: the shared top level carries no domain or vars.

on:
  workflow_call:
    inputs:
      environment:
        description: "Name of the env block in wrangler.jsonc: staging | test | production | ..."
        type: string
        required: true
      build_command:
        description: "Build command; pass the Vite mode here, e.g. 'npm run build -- --mode staging'"
        type: string
        default: "npm run build"
      build_env:
        description: "Newline-separated VITE_KEY=value lines exported to the build. Only VITE_* names; names that look like secrets are refused."
        type: string
        default: ""
      health_url:
        description: "Public URL of this environment (e.g. https://staging.zepruv.me/). After deploy it must serve this commit's /version.txt."
        type: string
        default: ""
      working_directory:
        description: "Folder that holds package.json and wrangler.jsonc"
        type: string
        default: "."
      node_version:
        type: string
        default: "22"
      output_dir:
        description: "Build output directory, relative to working_directory (must match assets.directory in wrangler.jsonc)"
        type: string
        default: "dist"
      ref:
        description: "Commit to build and deploy (empty = the triggering commit). Use it to promote a commit that is already on staging."
        type: string
        default: ""
    secrets:
      CLOUDFLARE_API_TOKEN:
        description: "API token: the 'Edit Cloudflare Workers' template, scoped to the account and the zone that owns the domains"
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

# One deploy at a time per repo + environment; a newer push waits instead of racing the running upload.
concurrency:
  group: deploy-frontend-${{ github.repository }}-${{ inputs.environment }}
  cancel-in-progress: false

env:
  WRANGLER_VERSION: "4.138.0"
  WRANGLER_SEND_METRICS: "false"

jobs:
  deploy:
    name: Build and deploy (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Check the environment
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
          CALLER_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_ENV" =~ ^[a-z][a-z0-9-]{0,30}$ ]] || { echo "::error::environment must be lowercase letters, digits and hyphens (got '$DEPLOY_ENV')"; exit 1; }
          if [ "$DEPLOY_ENV" = production ] && [ "$CALLER_REF" != refs/heads/main ]; then
            echo "::error::production deploys only run from main (this run is on $CALLER_REF)"; exit 1
          fi
          echo "ok: deploying environment '$DEPLOY_ENV' from $CALLER_REF"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Record the commit being built
        run: echo "BUILT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working_directory }}/package-lock.json

      - name: Export build variables (VITE_* only)
        env:
          BUILD_ENV: ${{ inputs.build_env }}
        run: |
          set -euo pipefail
          while IFS= read -r line || [ -n "$line" ]; do
            line="${line%$'\r'}"
            [[ -z "${line//[[:space:]]/}" || "$line" =~ ^[[:space:]]*# ]] && continue
            if [[ ! "$line" =~ ^[[:space:]]*(VITE_[A-Z0-9_]+)=(.*)$ ]]; then
              echo "::error::build_env accepts only VITE_KEY=value lines (offending name: ${line%%=*})"; exit 1
            fi
            name="${BASH_REMATCH[1]}"; value="${BASH_REMATCH[2]}"
            if [[ "$name" =~ (SECRET|PASSWORD|PASSWD|PRIVATE|CREDENTIAL) ]]; then
              echo "::error::$name looks like a secret. VITE_* values are baked into the public bundle - a secret must never be one."; exit 1
            fi
            if [ -z "$value" ]; then
              echo "::notice::$name is empty (repository variable not set?) - not exported"; continue
            fi
            echo "$name=$value" >> "$GITHUB_ENV"
            echo "build var: $name"
          done <<< "$BUILD_ENV"

      - name: Install
        run: npm ci

      - name: Build
        env:
          BUILD_COMMAND: ${{ inputs.build_command }}
        run: |
          set -euo pipefail
          export VITE_APP_VERSION="${BUILT_SHA::12}"   # the app can show which build it is; a .env.<mode> file can not override the commit
          bash -c "$BUILD_COMMAND"

      - name: Check the build output and add the version marker
        env:
          OUTPUT_DIR: ${{ inputs.output_dir }}
          DEPLOY_ENV: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          [ -f "$OUTPUT_DIR/index.html" ] || { echo "::error::$OUTPUT_DIR/index.html missing - the build produced no site"; exit 1; }
          printf '%s\n%s\n' "$BUILT_SHA" "$DEPLOY_ENV" > "$OUTPUT_DIR/version.txt"
          # never cached, or the post-deploy check could read a stale marker
          printf '\n/version.txt\n  Cache-Control: no-store\n' >> "$OUTPUT_DIR/_headers"
          echo "output: $(find "$OUTPUT_DIR" -type f | wc -l | tr -d ' ') files, $(du -sh "$OUTPUT_DIR" | cut -f1); version marker ${BUILT_SHA::12} ($DEPLOY_ENV)"

      - name: Scan the bundle for secrets (gitleaks)
        env:
          OUTPUT_DIR: ${{ inputs.output_dir }}
        run: |
          set -euo pipefail
          VERSION=8.24.0
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o "$RUNNER_TEMP/gitleaks.tgz"
          echo "cb49b7de5ee986510fe8666ca0273a6cc15eb82571f2f14832c9e8920751f3a4  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          args=(detect --no-git --source "$OUTPUT_DIR" --redact --no-banner)
          [ -f .gitleaks.toml ] && args+=(--config "$PWD/.gitleaks.toml")
          # runs on what will actually be published, so it catches a secret whatever way it got into the build
          "$RUNNER_TEMP/gitleaks" "${args[@]}"

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_ENV: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          # wrangler refuses an --env that has no block in wrangler.jsonc, so a typo cannot deploy anything.
          npx --yes "wrangler@${WRANGLER_VERSION}" deploy --env "$DEPLOY_ENV" \
            --message "${DEPLOY_ENV}: ${GITHUB_REPOSITORY}@${BUILT_SHA::12}" | tee "$RUNNER_TEMP/wrangler.out"
          version="$(grep -oE 'Current Version ID: [0-9a-f-]+' "$RUNNER_TEMP/wrangler.out" | tail -n1 || true)"
          { echo "### Deployed \`${DEPLOY_ENV}\`"; echo "- commit: \`${BUILT_SHA::12}\`"; [ -n "$version" ] && echo "- ${version}"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the environment URL serves this commit
        if: ${{ inputs.health_url != '' }}
        env:
          HEALTH_URL: ${{ inputs.health_url }}
          DEPLOY_ENV: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          marker="${HEALTH_URL%/}/version.txt"
          for i in $(seq 1 18); do
            got="$(curl -sS --max-time 15 -H 'Cache-Control: no-cache' "${marker}?v=${BUILT_SHA}" 2>/dev/null | head -n1 | tr -d '\r' || true)"
            echo "attempt $i: $marker -> '${got:0:12}' (want ${BUILT_SHA::12})"
            [ "$got" = "$BUILT_SHA" ] && { echo "ok: $HEALTH_URL serves this commit"; exit 0; }
            sleep 10
          done
          echo "::error::$HEALTH_URL does not serve this commit. Check that the '$DEPLOY_ENV' block in wrangler.jsonc has this domain as a custom_domain route, and that no leftover DNS record blocks it."
          exit 1
