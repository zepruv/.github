name: Reusable Frontend Enterprise CI

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: '22'
      run-gitleaks:
        required: false
        type: boolean
        default: true
      run-audit:
        required: false
        type: boolean
        default: true
      run-lint:
        required: false
        type: boolean
        default: true
      build-command:
        required: false
        type: string
        default: 'npm run build'

jobs:
  # 1. Secret & Credential Leak Detection
  secret-scan:
    name: Secret & Credential Leak Scan
    if: ${{ inputs.run-gitleaks }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks (Open Source Engine)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz | tar -xz
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks Secret Detector
        run: gitleaks detect --verbose --redact

  # 2. Dependency Vulnerability & Security Audit
  security-audit:
    name: Dependency Vulnerability Audit
    if: ${{ inputs.run-audit }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'

      - name: Audit Dependencies for Known CVEs
        run: npm audit --audit-level=critical

  # 3. Static Analysis, Anti-Patterns & Code Smells
  code-quality:
    name: Code Smells & Static Analysis (ESLint)
    if: ${{ inputs.run-lint }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # 4. Production Build & Bundle Size Budget
  build-validation:
    name: Production Compilation & Asset Verification
    runs-on: ubuntu-latest
    needs: [secret-scan, security-audit, code-quality]
    if: always() && (needs.secret-scan.result == 'success' || needs.secret-scan.result == 'skipped') && (needs.security-audit.result == 'success' || needs.security-audit.result == 'skipped') && (needs.code-quality.result == 'success' || needs.code-quality.result == 'skipped')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile Production Bundle
        run: ${{ inputs.build-command }}

      - name: Inspect Bundle Size Breakdown
        run: |
          echo "========================================="
          echo "       PRODUCTION ASSET MANIFEST         "
          echo "========================================="
          ls -lh dist/assets/ || ls -lh dist/
          du -sh dist/
